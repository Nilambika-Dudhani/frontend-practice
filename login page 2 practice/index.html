<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <section class="left">
            <img src="/image.png" alt="backgorund_image">
            <div class="welcome-text">Welcome Back!</div>
        </section>
        <section class="right">
            <div id="login">
                <h1>Login</h1>
                <h6>Welcome back! Please login to your account.</h6>
                <br><br>
            </div>
            <div id="form">
                <form action="">
                <label for="">Username</label>
                <br>
                <input type="text" name="username" id="" placeholder="Add your Username">
                <br><br>
                <label for="">Password</label>
                <br>
                <input type="password" name="password" id="" placeholder="Enter your password">
                <br><br>
                <div id="Remember">
                    <input type="checkbox" name="checkbox_remeberme" id="">
                    <label for="">Remember Me</label>
                    <a href="">Forget Password</a>
                    <br><br>
                </div>
                <button type="submit">LOGIN</button>
                <br><br>
                </form>
            </div>
            <div id="sign up">
                <h6>New User?</h6><a href="">Sign Up</a>
            </div>
        
        </section>
    </main>


    
</body>
</html>
